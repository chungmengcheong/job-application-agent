<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Recruiting Agent</title>
<meta name="description" content="Assess your resume against a job description, close gaps with targeted questions, and get a tailored, redlined resume.">
<link rel="stylesheet" href="/app/css/styles.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1 id="workspace-heading" tabindex="-1">AI Recruiting Agent</h1>
    <p class="tagline">AI-Powered Job Application Helper</p>
  </div>
  <div class="header-controls">
    <button type="button" id="api-mode-toggle" class="pill-button hidden"></button>
    <button type="button" id="demo-toggle" class="pill-button"></button>
    <div id="auth-controls"></div>
  </div>
</header>

<div id="error-banner" class="error-banner hidden" role="alert"></div>

<main class="workspace">
  <section id="section-loading" class="panel hidden" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>Generating your review… this can take up to two minutes.</p>
  </section>

  <section id="section-review" class="panel review-panel hidden">
    <div class="review-tabs" role="tablist" aria-label="Review sections">
      <button type="button" id="tab-job-description" class="review-tab" role="tab" aria-selected="false" aria-controls="tab-panel-job-description" data-review-tab="job-description">
        Job Description
      </button>
      <button type="button" id="tab-job-fit" class="review-tab" role="tab" aria-selected="false" aria-controls="tab-panel-job-fit" data-review-tab="job-fit" disabled>
        Job fit
      </button>
      <button type="button" id="tab-questions" class="review-tab" role="tab" aria-selected="false" aria-controls="tab-panel-questions" data-review-tab="questions" disabled>
        Questions for You
      </button>
      <button type="button" id="tab-resume" class="review-tab" role="tab" aria-selected="false" aria-controls="tab-panel-resume" data-review-tab="resume">
        Resume
      </button>
    </div>

    <section id="tab-panel-job-description" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-job-description" tabindex="0">
      <div id="submission-content">
        <h2>Job Description</h2>
        <p id="submission-hint" class="hint"></p>

        <label for="job-description">Job description</label>
        <textarea id="job-description" placeholder="Paste job description here..." rows="12"></textarea>

        <label for="source-url">Page URL (optional)</label>
        <input id="source-url" type="url" placeholder="https://example.com/job">

        <button type="button" id="submit-review" class="primary-button">Submit for Review</button>
      </div>
      <div id="review-job-description-view" class="hidden">
        <h2>Job Description</h2>
        <div id="review-job-description" class="job-description-body"></div>
      </div>
    </section>

    <section id="tab-panel-job-fit" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-job-fit" tabindex="0">
      <div id="review-fit"></div>
      <div id="review-gap-map"></div>
      <div id="job-fit-actions" class="review-actions hidden">
        <button type="button" id="update-answers" class="secondary-button">Provide answers to questions</button>
        <button type="button" id="see-proposed-resume" class="primary-button" disabled>See proposed resume</button>
      </div>
    </section>

    <section id="tab-panel-questions" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-questions" tabindex="0">
      <div id="questions-form"></div>
      <button type="button" id="submit-answers" class="primary-button secondary hidden">Submit additional information</button>
    </section>

    <section id="tab-panel-resume" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-resume" tabindex="0">
      <div id="baseline-resume-view" class="resume-view hidden">
        <h2>Resume</h2>
        <div id="baseline-resume" class="resume-body plain-resume"></div>
      </div>

      <div id="revised-resume-view" class="resume-view hidden">
        <h2>Proposed resume</h2>
        <div class="resume-controls">
          <label class="redline-toggle-label">
            <input type="checkbox" id="redline-toggle" checked>
            Show redline
          </label>
          <button type="button" id="copy-resume" class="secondary-button">Copy clean text</button>
        </div>
        <p class="hint">My suggestions are in redline. Hover a change to accept, reject, or edit it.</p>
        <div id="redline-container" class="resume-body"></div>
      </div>
    </section>
  </section>
</main>

<script type="module" src="/app/js/main.js"></script>
</body>
</html>
